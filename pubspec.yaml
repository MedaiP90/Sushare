name: Sushare
description: Distributed group ordering app for restaurants
publish_to: none
version: 1.3.1+6

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.1

  sqflite: ^2.4.2+1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  uuid: ^4.5.1

  bluetooth_low_energy: ^6.2.0
  http: ^1.2.0          # used by menu_ai_service for external AI API calls

  go_router: ^17.2.3

  dynamic_color: ^1.7.0
  flex_color_scheme: ^8.0.2
  google_fonts: ^8.1.0

  image_picker: ^1.2.2
  image_picker_android: ^0.8.13+17
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5

  anthropic_sdk_dart: ^2.2.0

  flutter_secure_storage: ^10.0.0

  permission_handler: ^12.0.1
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  shared_preferences: ^2.3.5
  flutter_svg: ^2.0.7
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/profile_icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/sushare.png"
  adaptive_icon_background: "#FFF9EC"
  adaptive_icon_foreground: "assets/sushare.png"
  remove_alpha_ios: true
