name: sushare
description: Distributed group ordering app for restaurants
publish_to: none
version: 1.3.3+8

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  anthropic_sdk_dart: ^2.2.0
  bluetooth_low_energy: ^6.2.0
  dynamic_color: ^1.7.0
  flex_color_scheme: ^8.0.2
  flutter_image_compress: ^2.3.0
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.7
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  http: ^1.2.0
  image_picker: ^1.2.2
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.10.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.5
  sqflite: ^2.4.2+1
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/profile_icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/sushare.png"
  adaptive_icon_background: "#FFF9EC"
  adaptive_icon_foreground: "assets/sushare.png"
  remove_alpha_ios: true
