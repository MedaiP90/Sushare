name: sushare
description: Distributed group ordering app for restaurants
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  sqflite: ^2.4.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  dio: ^5.8.0
  web_socket_channel: ^3.0.1
  http: ^1.2.0

  go_router: ^14.8.1

  dynamic_color: ^1.7.0
  flex_color_scheme: ^8.0.2
  google_fonts: ^6.2.1

  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5

  anthropic_sdk_dart: ^2.1.0

  flutter_secure_storage: ^9.2.4

  permission_handler: ^11.3.1
  share_plus: ^10.1.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true